[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grillmaster"
version = "0.1.0"
description = "Japanese variety show transcription"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.135",
    "elevenlabs>=2.24.0",
    "ffmpeg-python>=0.2.0",
    "loguru>=0.7.3",
    "pycryptodomex>=3.23.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "rich>=14.3.1",
    "textual>=6.0.0",
    "textual-image>=0.8.0",
    "typer>=0.21.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
grill = "grillmaster.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.17",
    "basedpyright>=1.31",
    "import-linter>=2.3",
    "poethepoet>=0.37",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/grillmaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real agent CLIs and spends subscription quota"]
addopts = "-ra --strict-markers -m 'not live'"

[tool.ruff]
target-version = "py313"
line-length = 88
